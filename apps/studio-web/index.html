<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEAN-STUDIO V0.2-A</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8eaed;color:#26313b;font:14px system-ui,sans-serif}header{height:58px;background:#252c33;color:white;display:flex;align-items:center;gap:14px;padding:0 20px}header b{letter-spacing:2px}header small{color:#a6b2bd}header span{margin-left:auto;color:#e8c45f}main{display:grid;grid-template-columns:225px minmax(300px,1fr) 280px;gap:12px;padding:12px;height:calc(100vh - 58px)}aside,section{background:white;border-radius:10px;padding:16px;overflow:auto}section{display:flex;flex-direction:column;padding:0;overflow:hidden}h3{font-size:14px;margin:0 0 12px}h4{margin:18px 0 8px;font-size:12px;color:#75818d}button,input,select{font:inherit}button{border:1px solid #d2d8de;background:white;border-radius:6px;padding:9px;cursor:pointer;color:inherit}button:hover{background:#f5e7ad}button.primary{background:#e7c55a;border-color:#e7c55a}aside button{width:100%;margin-bottom:7px}input[type=number]{width:100%;padding:7px;border:1px solid #cbd2da;border-radius:5px}label{display:block;font-size:12px;color:#56636e;margin:8px 0}canvas{width:100%;height:100%;min-height:260px;touch-action:none;background:#f4f6f8}#bar{padding:12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #e5e8eb}#bar small{margin-left:auto;color:#74818d}#status{padding:10px;color:#6a5624;background:#fff6d8;font-size:12px}table{border-collapse:collapse;width:100%;font-size:12px}td{border-bottom:1px solid #e6e9ec;padding:6px 2px}td:last-child{text-align:right}#parts{max-height:180px;overflow:auto}#parts button{text-align:left;padding:5px;font-size:12px}.active{background:#fae9ae}small{line-height:1.5}#details{min-height:70px}@media(max-width:900px){main{grid-template-columns:170px 1fr; height:auto}aside:last-child{grid-column:1/-1}section{height:65vh}} </style>
<header><b>LEAN-STUDIO</b><small>V0.2-A · PART CONTRACT PROBE</small><span>概念验证 / 非制造图</span></header><main><aside><h3>设计模式</h3><button id="standard" class="primary">标准工作台</button><button id="free">自由搭建</button><h4>数字零件库</h4><button id="tube">+ Ø28 精益管</button><button id="profile">+ 40×40 型材</button><button id="plate">+ 板材</button><button id="import">导入 GLB + JSON</button><input type="file" id="files" multiple accept=".glb,.json" hidden><h4>产品参数（mm）</h4><label>工作台长度<input id="width" type="number" min="1000" max="2200" step="100" value="1500"></label><button id="resize">应用尺寸</button><button id="module">+ 底层搁板</button><h4>项目数据</h4><button id="save">保存 JSON</button><button id="load">读取 JSON</button><input type="file" id="project" accept=".json" hidden><button id="undo">撤销</button></aside><section><div id="bar"><button id="reset">复位视角</button><button id="rotate">旋转选件 90°</button><small>拖动旋转 · 滚轮缩放 · 点击选件</small></div><canvas id="view"></canvas><div id="status"></div></section><aside><h3>装配实例</h3><div id="parts"></div><h4>选中零件参数</h4><div id="details"></div><button id="apply">应用零件参数</button><button id="del">删除选中零件</button><h4>BOM（示例净尺寸）</h4><table id="bom"></table><h4>工程状态</h4><small>NEEDS_REVIEW<br>不含实际连接件、载荷、采购及下料校核。Canvas 3D 投影，非 Three.js / CAD 验收。</small></aside></main>
<script>
'use strict';const $=id=>document.getElementById(id), C=$('view'),ctx=C.getContext('2d');let state={schema:'0.2-A',mode:'standard',width:1500,next:1,parts:[],catalog:{}},selected=null,history=[],yaw=-.65,pitch=.58,zoom=1,projected=[];const clone=x=>JSON.parse(JSON.stringify(x));function msg(s){$('status').textContent=s}function mark(){history.push(clone(state));if(history.length>40)history.shift()}function add(kind,x,y,z,l,d,h,role='',rot=0){let p={id:'P'+state.next++,kind,x,y,z,l,d,h,rot,role};state.parts.push(p);return p}function standard(){state.mode='standard';state.parts=[];state.width=1500;state.next=1;let w=state.width;for(let x of [0,w-40])for(let y of [0,710])add('profile',x,y,0,40,40,825,'leg',0);for(let y of [0,710])add('profile',40,y,785,w-80,40,40,'long');for(let x of [0,w-40])add('profile',x,40,785,40,670,40,'cross');add('plate',0,0,825,w,750,25,'top');selected=null;refresh()}function resize(){let w=+$('width').value;if(!Number.isInteger(w)||w<1000||w>2200||state.mode!=='standard')return msg('仅标准模式支持 1000–2200 mm 工作台长度');mark();let old=state.width;state.width=w;for(let p of state.parts){if(p.role==='long')p.l=w-80;if(p.role==='top')p.l=w;if(p.role==='shelf')p.l=w-80;if(['leg','cross'].includes(p.role)&&p.x===old-40)p.x=w-40}refresh()}
function box(l,d,h){return {v:[[0,0,0],[l,0,0],[l,d,0],[0,d,0],[0,0,h],[l,0,h],[l,d,h],[0,d,h]],f:[[0,1,2,3],[4,7,6,5],[0,4,5,1],[1,5,6,2],[2,6,7,3],[3,7,4,0]]}}function tube(l){let v=[],f=[],n=20;for(let x of [0,l])for(let r of [14,13])for(let i=0;i<n;i++){let a=i*Math.PI*2/n;v.push([x,14+r*Math.cos(a),14+r*Math.sin(a)])}for(let i=0;i<n;i++){let j=(i+1)%n;f.push([i,j,2*n+j,2*n+i],[n+i,3*n+i,3*n+j,n+j],[i,n+i,n+j,j],[2*n+i,2*n+j,3*n+j,3*n+i])}return {v,f}}
function geom(p){if(p.kind==='rigid')return state.catalog[p.asset].mesh;if(p.kind==='tube')return tube(p.l);return box(p.l,p.d,p.h)}function refresh(){if(!state.parts.some(p=>p.id===selected))selected=null;$('width').value=state.width;$('parts').replaceChildren();for(let p of state.parts){let b=document.createElement('button');b.textContent=p.id+' · '+p.kind+(p.role?' / '+p.role:'');b.className=p.id===selected?'active':'';b.onclick=()=>{selected=p.id;refresh()};$('parts').append(b)}let p=state.parts.find(p=>p.id===selected);$('details').replaceChildren();if(p){for(let key of ['x','y','z','l','d','h']){let lab=document.createElement('label'),i=document.createElement('input');lab.textContent=key+' (mm)';i.id='edit_'+key;i.type='number';i.value=p[key];i.disabled=p.role&&p.role!=='custom'||(p.kind==='rigid'&&['l','d','h'].includes(key))||(p.kind==='tube'&&['d','h'].includes(key))||(p.kind==='profile'&&['d','h'].includes(key));lab.append(i);$('details').append(lab)}}else $('details').textContent='点击模型或实例选择。';let m={};for(let p of state.parts){let k=p.kind==='rigid'?p.asset:p.kind+' '+[p.l,p.d,p.h].join('×');m[k]=(m[k]||0)+1}$('bom').replaceChildren();for(let [k,n] of Object.entries(m)){let tr=document.createElement('tr');for(let t of [k,n]){let td=document.createElement('td');td.textContent=t;tr.append(td)}$('bom').append(tr)}msg(state.mode+' / '+state.parts.length+' 个实例 · 示例工程状态 NEEDS_REVIEW');draw()}
function draw(){let rect=C.getBoundingClientRect(),w=rect.width,h=rect.height;if(!w||!h)return;C.width=w*devicePixelRatio;C.height=h*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.clearRect(0,0,w,h);let s=Math.min(w/2200,h/1500)*zoom,ox=w/2,oy=h*.62;function pr(v){let x=v[0]-state.width/2,y=v[1]-375,z=v[2]-350,a=x*Math.cos(yaw)-y*Math.sin(yaw),b=x*Math.sin(yaw)+y*Math.cos(yaw);return [ox+a*s,oy-(z*Math.cos(pitch)-b*Math.sin(pitch))*s,b*Math.cos(pitch)+z*Math.sin(pitch)]}function line(a,b){let A=pr(a),B=pr(b);ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke()}ctx.strokeStyle='#dce1e6';for(let i=-500;i<=2500;i+=200){line([i,-500,0],[i,1500,0]);line([-500,i,0],[2500,i,0])}projected=[];for(let p of state.parts){let g=geom(p),r=p.rot*Math.PI/180,v=g.v.map(([x,y,z])=>pr([p.x+x*Math.cos(r)-y*Math.sin(r),p.y+x*Math.sin(r)+y*Math.cos(r),p.z+z]));for(let f of g.f){let q=f.map(i=>v[i]);projected.push({p,q,z:q.reduce((a,b)=>a+b[2],0)/q.length,shade:Math.abs(f[0]%4)})}}projected.sort((a,b)=>a.z-b.z);for(let {p,q,shade} of projected){ctx.beginPath();q.forEach((v,i)=>i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1]));ctx.closePath();ctx.fillStyle=p.id===selected?'#e6bd48':p.kind==='plate'?['#e0e4e8','#f9fafb','#c2cbd3','#d8e0e5'][shade]:p.kind==='rigid'?'#4b5965':['#a3b1bc','#cdd6dd','#7e909f','#aab8c1'][shade];ctx.fill();ctx.strokeStyle='#73818d';ctx.lineWidth=.55;ctx.stroke()}}
function pointIn(q,x,y){let c=false;for(let i=0,j=q.length-1;i<q.length;j=i++){let a=q[i],b=q[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}let drag=null;C.onpointerdown=e=>{drag={x:e.offsetX,y:e.offsetY,m:0};C.setPointerCapture(e.pointerId)};C.onpointermove=e=>{if(drag){let dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;drag.m+=Math.abs(dx)+Math.abs(dy);yaw+=dx*.008;pitch=Math.max(.1,Math.min(1.4,pitch+dy*.008));drag.x=e.offsetX;drag.y=e.offsetY;draw()}};C.onpointerup=e=>{if(drag&&drag.m<4){let hit=[...projected].reverse().find(a=>pointIn(a.q,e.offsetX,e.offsetY));selected=hit?.p.id||null;refresh()}drag=null};C.onwheel=e=>{e.preventDefault();zoom=Math.max(.4,Math.min(3,zoom*Math.exp(-e.deltaY*.001)));draw()};new ResizeObserver(draw).observe(C);
$('standard').onclick=()=>{mark();standard()};$('free').onclick=()=>{mark();state.mode='free';state.parts=[];selected=null;refresh()};$('resize').onclick=resize;$('module').onclick=()=>{if(state.mode!=='standard'||state.parts.some(p=>p.role==='shelf'))return;mark();add('plate',40,40,180,state.width-80,670,25,'shelf');refresh()};for(let k of ['tube','profile','plate'])$(k).onclick=()=>{mark();let p=add(k,100+state.parts.length*30,100,0,k==='plate'?400:500,k==='tube'?28:k==='profile'?40:300,k==='tube'?28:k==='profile'?40:25,'custom');selected=p.id;refresh()};$('apply').onclick=()=>{let p=state.parts.find(p=>p.id===selected);if(!p)return;if(p.role&&p.role!=='custom')return msg('模板零件由产品参数控制');let v={};for(let k of ['x','y','z','l','d','h']){let i=$('edit_'+k);v[k]=i.disabled?p[k]:+i.value;if(!Number.isFinite(v[k])||(['l','d','h'].includes(k)&&(v[k]<=0||v[k]>3000)))return msg('尺寸超出示例范围')}mark();Object.assign(p,v);refresh()};$('del').onclick=()=>{if(!selected)return;let p=state.parts.find(p=>p.id===selected);if(p.role&&p.role!=='custom'&&p.role!=='shelf')return msg('模板框架由产品参数控制');mark();state.parts=state.parts.filter(p=>p.id!==selected);refresh()};$('rotate').onclick=()=>{let p=state.parts.find(p=>p.id===selected);if(p&&(!p.role||p.role==='custom')){mark();p.rot=(p.rot+90)%360;refresh()}};$('reset').onclick=()=>{yaw=-.65;pitch=.58;zoom=1;draw()};$('undo').onclick=()=>{if(history.length){state=history.pop();refresh()}};
function parseGLB(buf){let d=new DataView(buf);if(d.getUint32(0,true)!==0x46546c67||d.getUint32(4,true)!==2)throw Error('GLB 2 only');let jlen=d.getUint32(12,true),g=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,20,jlen))),off=28+jlen;let nodes=g.nodes||[];if(nodes.length!==1||nodes[0].matrix||nodes[0].translation||nodes[0].rotation||nodes[0].scale||g.meshes.length!==1||g.meshes[0].primitives.length!==1)throw Error('仅支持单 mesh、单节点、无变换的测试 GLB');let p=g.meshes[0].primitives[0];if(p.mode!==undefined&&p.mode!==4)throw Error('仅支持三角形');let a=g.accessors[p.attributes.POSITION],b=g.accessors[p.indices],av=g.bufferViews[a.bufferView],bv=g.bufferViews[b.bufferView];if(a.componentType!==5126||a.type!=='VEC3'||![5123,5125].includes(b.componentType)||b.type!=='SCALAR'||av.byteStride||bv.byteStride||av.buffer!==0||bv.buffer!==0||a.sparse||b.sparse||a.count>10000||b.count>60000)throw Error('不支持该 accessor');let v=[],f=[],base=off+(av.byteOffset||0)+(a.byteOffset||0),ix=off+(bv.byteOffset||0)+(b.byteOffset||0),size=b.componentType===5123?2:4;for(let i=0;i<a.count;i++){let x=d.getFloat32(base+i*12,true),y=d.getFloat32(base+i*12+4,true),z=d.getFloat32(base+i*12+8,true);v.push([x*1000,-z*1000,y*1000])}for(let i=0;i<b.count;i+=3){let face=[0,1,2].map(k=>size===2?d.getUint16(ix+(i+k)*size,true):d.getUint32(ix+(i+k)*size,true));if(face.some(x=>x>=v.length))throw Error('index invalid');f.push(face)}return {v,f}}
$('import').onclick=()=>$('files').click();$('files').onchange=async()=>{try{let fs=[...$('files').files],a=fs.find(f=>f.name.endsWith('.glb')),b=fs.find(f=>f.name.endsWith('.json'));if(!a||!b)throw Error('同时选择 GLB 与 JSON');let meta=JSON.parse(await b.text());if(meta.edit_mode!=='rigid'||meta.units!=='mm'||meta.coordinate_system!=='RH_Z_UP'||!meta.part_id||!Array.isArray(meta.dimensions)||meta.dimensions.length!==3||meta.dimensions.some(n=>!Number.isFinite(n)||n<=0))throw Error('元数据不符合示例契约');let mesh=parseGLB(await a.arrayBuffer());let dim=[0,1,2].map(i=>Math.max(...mesh.v.map(v=>v[i]))-Math.min(...mesh.v.map(v=>v[i])));if(dim.some((n,i)=>Math.abs(n-meta.dimensions[i])>.05))throw Error('模型尺寸与 JSON 不一致');mark();let id=meta.part_id+'@'+meta.revision;state.catalog[id]={meta,mesh};let p=add('rigid',200,200,850,...meta.dimensions,'custom');p.asset=id;selected=p.id;refresh();msg('导入成功：单位与三轴外形尺寸已核对，接口尚未校验')}catch(e){msg('导入失败：'+e.message)}$('files').value=''};
$('save').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='lean-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('load').onclick=()=>$('project').click();$('project').onchange=async()=>{try{let n=JSON.parse(await $('project').files[0].text());if(n.schema!=='0.2-A'||!Array.isArray(n.parts)||!n.catalog||!Number.isFinite(n.width)||n.parts.some(p=>!['tube','profile','plate','rigid'].includes(p.kind)||!['x','y','z','l','d','h','rot'].every(k=>Number.isFinite(p[k]))||(p.kind==='rigid'&&!n.catalog[p.asset])))throw Error('项目格式不符');mark();state=n;selected=null;refresh()}catch(e){msg('读取失败：'+e.message)}$('project').value=''};window.inspectLean=()=>clone(state);standard();
</script></html>
