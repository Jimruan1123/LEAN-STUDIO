<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEAN-STUDIO V0.2-E.1</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#26323a;background:#e9edf0}header{background:#252c33;color:#fff;padding:16px 22px;display:flex;align-items:center;gap:16px}header b{letter-spacing:2px}header span{margin-left:auto;color:#e6c35e;font-size:12px}main{display:grid;grid-template-columns:250px minmax(300px,1fr) 280px;gap:12px;padding:12px;min-height:calc(100vh - 57px)}aside,section{background:#fff;border-radius:10px;padding:14px;min-width:0}h2{font-size:14px;margin:0 0 12px}h3{font-size:12px;color:#61717c;margin:20px 0 8px}button,input,select{font:inherit;border:1px solid #d3dbe0;border-radius:6px;padding:8px;background:#f7f9fa;color:#26323a}button{cursor:pointer}button:hover{background:#e4e9ed}button.primary{background:#e6c35e;border-color:#e6c35e;font-weight:600}button:disabled{opacity:.4;cursor:default}label{display:block;color:#5f6d77;font-size:12px;margin:8px 0 3px}input,select{width:100%}.buttons{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.buttons button{flex:1}#catalog{display:grid;gap:5px}.asset{padding:8px;background:#eef1f3;border-radius:6px;font-size:12px}.asset b{display:block}.asset small{color:#60707b}.viewport{height:55vh;min-height:360px;background:#f2f5f6;border:1px solid #dce3e6;border-radius:8px;position:relative;overflow:hidden}#view{position:absolute;inset:0}#fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:10px;text-align:center;color:#5b6974}#fallback img{max-width:90%;max-height:70%;object-fit:contain}#fallback[hidden]{display:none}#renderstatus,#message{font-size:12px;margin:8px 0;color:#53646f;min-height:18px}#message{padding:8px;background:#eef1f3;border-radius:5px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:7px 3px;border-bottom:1px solid #e6eaec;text-align:left}th{color:#71808a}td:last-child,th:last-child{text-align:right}.metrics{display:flex;gap:18px;margin:12px 0}.metrics strong{font-size:24px;display:block}.metrics small{color:#60717a}.split{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.hint{font-size:11px;color:#6b7880;line-height:1.5}.warn{color:#9b6a15}#partlist{height:130px}#importfile{display:none}@media(max-width:850px){main{grid-template-columns:1fr} .viewport{height:50vh}}
.asset{text-align:left;width:100%}.asset:disabled{cursor:default}.viewtools label{display:flex;gap:6px;align-items:center;margin:0;padding:5px 8px}.viewtools input{width:auto}.viewport{height:60vh}#view canvas{display:block;touch-action:none} @media(min-width:1100px){main{grid-template-columns:220px minmax(0,1fr) 245px}}
</style></head><body><header><b>LEAN-STUDIO</b><small>4040t / V0.2-E.1</small><span>研究样件 · 未经工程认证</span></header><main><aside><h2>设计模式</h2><div class="buttons"><button id="standard" class="primary">标准框架</button><button id="free">自由搭建</button></div><h3>标准零件库 / 5 类</h3><div id="catalog"></div><h3>自由插入型材</h3><label>方向</label><select id="orientation"><option>Z</option><option>X</option><option>Y</option></select><label>长度 mm</label><input id="newlength" type="number" min="100" max="3000" value="500"><label>起点 X / Y / Z mm</label><div class="split"><input id="x" type="number" value="0"><input id="y" type="number" value="0"><input id="z" type="number" value="0"></div><div class="buttons"><button id="insert" class="primary">添加型材</button></div><h3>装配关系</h3><label>竖柱</label><select id="vertical"></select><label>X/Y 向横梁</label><select id="horizontal"></select><label>角码位置</label><div class="buttons"><select id="side"><option value="left">左侧</option><option value="right">右侧</option></select><select id="level"><option value="bottom">底部</option><option value="top">顶部</option></select></div><button id="attach" class="primary">吸附 + 自动配件</button><p class="hint">自由搭建支持 XZ/YZ 直角连接，横梁单端关联；非通用约束求解。</p></aside><section><h2>装配工作区</h2><div class="buttons viewtools"><button id="fitview">适应视图</button><button id="isoview">轴测</button><button id="frontview">正视</button><button id="topview">顶视</button><label><input type="checkbox" id="autosnap" checked> 自动吸附</label></div><p id="movehint" class="hint"></p><div class="viewport"><div id="view"></div><div id="fallback"><img src="offline-reference.png" alt="上一轮离线装配模型"><b>三维渲染尚未启动</b><small>参考图为 V0.2-C 离线模型，不随操作变化。</small></div></div><div id="renderstatus">检查 Three.js 与 WebGL…</div><div class="metrics"><div><strong id="count">0</strong><small>零件实例</small></div><div><strong id="edges">0</strong><small>装配关系</small></div><div><strong id="mode">—</strong><small>设计模式</small></div></div><div id="message" role="status">就绪</div><h3>装配树 / 点击选择</h3><select id="partlist" size="6"></select><div class="buttons"><button id="undo">撤销</button><button id="save">导出 JSON</button><button id="load">导入 JSON</button><input type="file" id="importfile" accept=".json,application/json"></div></section><aside><h2>参数 / BOM</h2><h3>标准框架参数</h3><label>横梁净长 mm</label><input id="beam" type="number" value="500"><label>立柱长度 mm</label><input id="post" type="number" value="500"><div class="buttons"><button class="primary" id="resizeframe">更新框架</button></div><h3>选中零件</h3><div id="selected">未选择</div><label>位置 X / Y / Z mm</label><div class="split"><input id="posx" type="number" step="1"><input id="posy" type="number" step="1"><input id="posz" type="number" step="1"></div><button id="applypos">应用位置</button><label>长度 mm（仅型材）</label><input id="editlength" type="number" value="500"><div class="buttons"><button id="resizepart">更新</button><button id="remove">删除</button></div><div class="buttons"><button id="capa">加始端盖</button><button id="capb">加末端盖</button></div><h3>材料清单（研究用）</h3><table><thead><tr><th>零件</th><th>长度</th><th>数量</th></tr></thead><tbody id="bom"></tbody></table><p class="hint warn">所有型号、紧固件长度与承载均待复核；不得直接用于采购、下料或制造。</p></aside></main><script src="assets.js?v=021"></script><script src="graph.js?v=021"></script><script src="ui.js?v=021"></script><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">const status=document.getElementById('renderstatus');const gl=document.createElement('canvas').getContext('webgl2');if(!gl){status.textContent='WebGL2 不可用；装配逻辑仍可操作。';}else{try{const {start}=await import('./renderer.js?v=021');await start();}catch(e){status.textContent='Three.js 加载/渲染失败：'+e.message;}}</script></body></html>
